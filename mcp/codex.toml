# ~/.codex/config.toml 의 [mcp_servers.*] (node_repl, computer-use 제외)

[mcp_servers.chrome-devtools]
command = "npx"
args = [
    "-y",
    "chrome-devtools-mcp@latest",
]

[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp",
]

[mcp_servers.filesystem]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-filesystem",
    "/Volumes/VEGA/Data",
]

[mcp_servers.magic-ui]
command = "npx"
args = [
    "-y",
    "@21st-dev/magic@latest",
    'API_KEY="{{SECRET:magic-ui_1}}"',
]

[mcp_servers.morphllm-fast-apply]
command = "npx"
args = [
    "-y",
    "@morph-llm/morph-fast-apply",
]

[mcp_servers.n8n]
command = "npx"
args = [
    "-y",
    "supergateway",
    "--sse",
    "https://dev.tvcf.co.kr/n8n/team1/mcp/{{SECRET:n8n_1}}/sse",
]

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
]

[mcp_servers.sequential-thinking]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-sequential-thinking",
]

[mcp_servers.serena]
command = "uvx"
args = [
    "--from",
    "git+https://github.com/oraios/serena",
    "serena",
    "start-mcp-server",
    "--context",
    "ide-assistant",
]
