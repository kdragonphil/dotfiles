# ~/.codex/config.toml 의 [mcp_servers.*] (node_repl, computer-use 제외)

[mcp_servers.ai-memory]
url = "http://127.0.0.1:49374/mcp"
default_tools_approval_mode = "approve"
bearer_token_env_var = "AI_MEMORY_AUTH_TOKEN"

[mcp_servers.ai-memory.tools.memory_delete_page]
approval_mode = "prompt"

[mcp_servers.ai-memory.tools.memory_feedback]
approval_mode = "prompt"

[mcp_servers.ai-memory.tools.memory_forget_sweep]
approval_mode = "prompt"

[mcp_servers.ai-memory.tools.memory_handoff_accept]
approval_mode = "prompt"

[mcp_servers.ai-memory.tools.memory_handoff_cancel]
approval_mode = "prompt"

[mcp_servers.ai-memory.tools.memory_message_cancel]
approval_mode = "prompt"

[mcp_servers.ai-memory.tools.memory_message_pop]
approval_mode = "prompt"

[mcp_servers.ai-memory.tools.memory_patch_page]
approval_mode = "prompt"

[mcp_servers.ai-memory.tools.memory_restore_page]
approval_mode = "prompt"

[mcp_servers.ai-memory.tools.memory_write_pages_batch]
approval_mode = "prompt"

[mcp_servers.chrome-devtools]
command = "npx"
args = [
    "-y",
    "chrome-devtools-mcp@latest",
]

[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp",
]

[mcp_servers.filesystem]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-filesystem",
    "/Volumes/VEGA/Data",
]

[mcp_servers.morphllm-fast-apply]
command = "npx"
args = [
    "-y",
    "@morph-llm/morph-fast-apply",
]

[mcp_servers.n8n]
command = "npx"
args = [
    "-y",
    "supergateway",
    "--sse",
    "https://dev.tvcf.co.kr/n8n/team1/mcp/{{SECRET:n8n_1}}/sse",
]

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
]

[mcp_servers.playwright.tools.browser_tabs]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_run_code_unsafe]
approval_mode = "approve"

[mcp_servers.sequential-thinking]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-sequential-thinking",
]

[mcp_servers.serena]
command = "uvx"
args = [
    "--from",
    "git+https://github.com/oraios/serena",
    "serena",
    "start-mcp-server",
    "--context",
    "ide-assistant",
]
